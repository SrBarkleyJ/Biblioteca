 <div class="bg-container">
        <div class="login-container">
            <div class="login-title">
                LOGIN
            </div>
            <div class="divider"></div>
            <form>
                <div class="form-group">
                    <div class="input-group">
                        <label for="email">Email address</label>
                        <i class="bi bi-envelope input-icon"></i>
                        <input
                            id="email"
                            class="input-field"
                            placeholder="Email address"
                            type="email"
                        />
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <i class="bi bi-lock input-icon"></i>
                        <input
                            id="password"
                            class="input-field"
                            placeholder="Password"
                            type="password"
                        />
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" type="button">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                        <button class="btn btn-primary" type="button">
                            <i class="bi bi-pencil-square"></i> Sign-up
                        </button>
                    </div>
                    <div class="or-divider">
                        <span>or</span>
                        <div class="divider"></div>
                    </div>
                    <div class="social-buttons">
                        <button class="social-btn btn-google" type="button">
                            <i class="bi bi-google"></i> Sign-in with Google
                        </button>
                        <button class="social-btn btn-facebook" type="button">
                            <i class="bi bi-facebook"></i> Sign-in with Facebook
                        </button>
                        <button class="social-btn btn-github" type="button">
                            <i class="bi bi-github"></i> Sign-in with Github
                        </button>
                    </div>
                    <div class="forgot-password">
                        <a>Forgot password</a>
                    </div>
                </div>
            </form>
        </div>
