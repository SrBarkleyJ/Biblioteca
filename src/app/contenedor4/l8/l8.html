<div class="font-sans">
    <div class="container">
        <div class="card-wrapper">

            <div class="card bg-blue-400 card-rot-1"></div>
            <div class="card bg-red-400 card-rot-2"></div>

            <div class="card-main">
                
                <label class="title">
                    Registrate
                </label>

                <form method="#" action="#" class="form">

                    <div>
                        <input type="text" placeholder="Nombres" class="input">
                    </div>

                    <div class="mt-7">
                        <input type="email" placeholder="Correo electronico" class="input">
                    </div>

                    <div class="mt-7">
                        <input type="password" placeholder="Contraseña" class="input">
                    </div>

                    <div class="mt-7">
                        <input type="password" placeholder="Confirmar contraseña" class="input">
                    </div>

                    <div class="mt-7">
                        <button class="btn-primary">
                            Registrar
                        </button>
                    </div>

                    <div class="separator">
                        <hr>
                        <label>Registrate con</label>
                        <hr>
                    </div>

                    <div class="social">
                        <button class="btn-social facebook">Facebook</button>
                        <button class="btn-social google">Google</button>
                    </div>

                    <div class="footer">
                        <label>¿Ya tienes una cuenta?</label>
                        <a href=" " class="login-link">Iniciar sesion</a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
